<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Phase 2D2 nested resize characterization</title>
    <link rel="stylesheet" href="/papi.css">
    <link rel="stylesheet" href="/official.css">
    <link rel="stylesheet" href="/column.css">
    <style>
      body { margin: 0; padding: 1rem; font: 16px/1.4 Arial, sans-serif; background: #f4f6f8; }
      #status { position: sticky; top: 0; z-index: 20; padding: .65rem; background: #fff; border: 1px solid #ccd4dc; }
      #fixtures { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); margin-top: 1rem; }
      .probe-case { min-width: 0; padding: .75rem; overflow: hidden; background: #fff; border: 1px solid #ccd4dc; }
      .probe-case h2 { margin: 0 0 .5rem; font-size: 1rem; }
      .probe-book, .probe-page { min-width: 0; overflow: hidden; }
      .probe-hidden { display: none; }
      #results { max-height: 32rem; overflow: auto; white-space: pre-wrap; background: #101820; color: #d9f2e6; padding: .75rem; }
    </style>
    <script src="/jquery.js"></script>
    <script src="/phase-2d2-runtime.js"></script>
    <script src="/papi.js"></script>
    <script src="/official.js"></script>
    <script src="/column.js"></script>
    <script src="/phase-2d2-runner.js" defer></script>
  </head>
  <body>
    <div id="status" role="status">Phase 2D2 probe starting…</div>
    <main id="fixtures"></main>
    <h2>Diagnostic result</h2>
    <pre id="results"></pre>
  </body>
</html>
